name: CI

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  merge_group:
    types: [ checks_requested ]

permissions: {}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      - name: Execute Makefile Build Target
        run: |
          make build

  lint:
    name: Linter
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      - name: Configure Go Environment
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run Golangci-Lint Runner
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      - name: Configure Go Environment
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Configure Zig Toolchain
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest
        
      - name: Execute Makefile Test Target
        run: |
          make test

  e2e:
    needs: [build, test]
    uses: ./.github/workflows/e2e.yml

  release:
    name: Release
    needs: [lint, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15-intel
    permissions:
      contents: write
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Docker
        uses: douglascamata/setup-docker-macos-action@v1.0.1
        with:
          lima: v1.2.1
          colima: v0.9.1

      - name: Make macOS SDK available to Docker
        run: |
          SDK_PATH="$(xcrun --sdk macosx --show-sdk-path)"
          ditto "$SDK_PATH" "$HOME/MacOSX.sdk"
          echo "MACOS_SDK_PATH=$HOME/MacOSX.sdk" >> "$GITHUB_ENV"

      - name: Run Makefile Release Target
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/}
          VERSION=$TAG_VERSION make release

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*_checksums.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger Docker Build Workflow
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.DOCKER_REPO_TRIGGER_PAT }}
          repository: go-rivet/docker
          event-type: rivet-release
          client-payload: '{"version": "${{ github.ref_name }}"}'
