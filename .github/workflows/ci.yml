name: CI

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  merge_group:
    types: [ checks_requested ]

permissions: {}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      - name: Execute Makefile Build Target
        run: |
          make build

  lint:
    name: Linter
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      - name: Configure Go Environment
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run Golangci-Lint Runner
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      - name: Configure Go Environment
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Configure Zig Toolchain
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest
        
      - name: Execute Makefile Test Target
        run: |
          make test

  e2e:
    needs: [build, test]
    uses: ./.github/workflows/e2e.yml

  release-build:
    name: Release build (${{ matrix.target.platform }})
    needs: [lint, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - platform: linux/386
            archive: rivet-linux-386.tar.gz
          - platform: linux/amd64
            archive: rivet-linux-amd64.tar.gz
          - platform: linux/arm64
            archive: rivet-linux-arm64.tar.gz
          - platform: linux/arm/7
            archive: rivet-linux-armv7.tar.gz
          - platform: windows/386
            archive: rivet-windows-386.zip
          - platform: windows/amd64
            archive: rivet-windows-amd64.zip
          - platform: windows/arm64
            archive: rivet-windows-arm64.zip
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cache Release Toolchain
        uses: actions/cache@v4
        with:
          path: ~/.cache/rivet/toolchain
          key: rivet-release-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target.archive }}-${{ hashFiles('Makefile', 'go.mod', 'go.sum', 'tools/toolchain/Dockerfile') }}

      - name: Run Makefile Release Target
        env:
          PLATFORM: ${{ matrix.target.platform }}
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/}
          TOOLCHAIN_CACHE_DIR="$HOME/.cache/rivet/toolchain" VERSION="$TAG_VERSION" make release PLATFORMS="$PLATFORM"

      - name: Upload Release Archive
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target.archive }}
          path: dist/${{ matrix.target.archive }}
          if-no-files-found: error

  release:
    name: Release
    needs: release-build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Release Archives
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum rivet-*.tar.gz rivet-*.zip > rivet_checksums.txt

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*_checksums.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger Docker Build Workflow
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.DOCKER_REPO_TRIGGER_PAT }}
          repository: go-rivet/docker
          event-type: rivet-release
          client-payload: '{"version": "${{ github.ref_name }}"}'
