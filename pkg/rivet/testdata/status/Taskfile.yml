version: '3'
tasks:
  gen-foo:
    cmds:
      - touch foo.txt
    status:
      - test 1 = 0
    transform:
      matches:
        - ./foo.txt
  gen-bar:
    cmds:
      - touch bar.txt
    status:
      - test 1 = 1
    transform:
      matches:
        - ./bar.txt
  gen-silent-baz:
    silent: true
    cmds:
      - touch baz.txt
    transform:
      matches:
       - ./baz.txt
